name: Claude Diff Review

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get diff and call Claude
        id: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git diff HEAD~1 HEAD -- '*.js' '*.ts' '*.html' '*.css' | head -c 10000 > /tmp/diff.txt

          node -e "
            const fs = require('fs');
            const https = require('https');

            const diff = fs.readFileSync('/tmp/diff.txt', 'utf8');
            const userMsg = diff.trim()
              ? 'Here is a git diff from a browser-based DAW project (Web Audio API, JS). Give a brief, useful code review — what changed, anything interesting or worth watching, any quick suggestions. Be concise (under 300 words).\n\n' + diff
              : 'No code changes in this push (only non-code files changed).';

            const body = JSON.stringify({
              model: 'claude-haiku-4-5-20251001',
              max_tokens: 512,
              messages: [{ role: 'user', content: userMsg }]
            });

            const options = {
              hostname: 'api.anthropic.com',
              path: '/v1/messages',
              method: 'POST',
              headers: {
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01',
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(body)
              }
            };

            const req = https.request(options, res => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                try {
                  const parsed = JSON.parse(data);
                  const review = parsed.content[0].text;
                  fs.writeFileSync('/tmp/review.txt', review);
                } catch(e) {
                  fs.writeFileSync('/tmp/review.txt', 'Claude review unavailable: ' + data.slice(0, 200));
                }
              });
            });
            req.on('error', e => {
              fs.writeFileSync('/tmp/review.txt', 'Request error: ' + e.message);
            });
            req.write(body);
            req.end();
          "

      - name: Post commit comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVIEW=$(cat /tmp/review.txt)
          COMMIT_SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          node -e "
            const https = require('https');
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review.txt', 'utf8');
            const body = JSON.stringify({ body: '### Claude Code Review\n\n' + review });
            const options = {
              hostname: 'api.github.com',
              path: '/repos/${{ github.repository }}/commits/${{ github.sha }}/comments',
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ${{ secrets.GITHUB_TOKEN }}',
                'Accept': 'application/vnd.github+json',
                'User-Agent': 'claude-review-action',
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(body)
              }
            };
            const req = https.request(options, res => {
              let data = '';
              res.on('data', c => data += c);
              res.on('end', () => console.log('Posted:', res.statusCode, data.slice(0, 100)));
            });
            req.on('error', e => { console.error(e); process.exit(1); });
            req.write(body);
            req.end();
          "
